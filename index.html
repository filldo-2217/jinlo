<!-- index.html -->

<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HealthMind</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
margin:0;
font-family:Pretendard,sans-serif;
background:#07030f;
color:white;
overflow-x:hidden;
}

.bg1{
position:fixed;
top:-200px;
left:-100px;
width:500px;
height:500px;
background:#7c3aed33;
filter:blur(140px);
border-radius:999px;
z-index:-1;
}

.bg2{
position:fixed;
bottom:-200px;
right:-100px;
width:500px;
height:500px;
background:#ec489933;
filter:blur(140px);
border-radius:999px;
z-index:-1;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(24px);

transform-style:preserve-3d;

transition:
all .5s ease;
}

.card:hover{
transform:
perspective(1200px)
rotateX(2deg)
rotateY(-2deg)
translateY(-3px);
}

.option.active{
border-color:#c084fc;
background:
linear-gradient(
to right,
rgba(192,132,252,0.28),
rgba(236,72,153,0.2)
);
}

.fade{
animation:fade .5s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.bar{
height:18px;
border-radius:999px;
background:
linear-gradient(
to right,
#a855f7,
#ec4899
);

transition:1.2s;
}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<section id="hero"
class="min-h-screen flex items-center">

<div class="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-20 items-center">

<div>

<div class="inline-block px-5 py-3 rounded-full border border-purple-400/20 bg-purple-500/10 text-purple-200 mb-8">
HealthMind Platform
</div>

<h1 class="text-7xl font-black leading-tight mb-8">

스마트폰 사용으로 인한

<span class="block bg-gradient-to-r from-purple-300 to-white bg-clip-text text-transparent">
건강 상태 분석
</span>

</h1>

<p class="text-gray-300 text-xl leading-relaxed mb-10">

거북목, 턱관절, 손목 통증,
근골격계 부담 등을 분석하여
현재 건강 상태를 확인할 수 있습니다.

</p>

<button
onclick="startTest()"
class="bg-gradient-to-r from-purple-400 to-pink-300 text-black font-black px-10 py-5 rounded-2xl hover:scale-105 transition-all duration-300 shadow-2xl shadow-purple-500/20">

건강 상태 검사하기

</button>

</div>

<div class="relative">

<div class="absolute inset-0 bg-purple-500/20 blur-3xl rounded-full"></div>

<div class="card rounded-[40px] p-8 relative">

<img
src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop"
class="rounded-3xl w-full h-[500px] object-cover">

</div>

</div>

</div>

</section>

<section
id="testSection"
class="hidden max-w-5xl mx-auto px-6 py-24">

<div id="questionBox"></div>

</section>

<section
id="resultSection"
class="hidden max-w-6xl mx-auto px-6 pb-32">

<div class="card rounded-[40px] p-10 fade">

<div class="text-center mb-16">

<h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-purple-300 to-white bg-clip-text text-transparent">

건강 분석 결과

</h2>

<div
id="totalScore"
class="text-7xl font-black mb-5">
</div>

<div
id="riskLevel"
class="text-3xl font-bold mb-6">
</div>

<p
id="riskText"
class="text-gray-300 text-lg leading-relaxed max-w-3xl mx-auto">
</p>

</div>

<div
id="graphArea"
class="space-y-8">
</div>

<div class="mt-20">

<h3 class="text-4xl font-black mb-8">
상세 분석표
</h3>

<div class="card rounded-[30px] p-8 overflow-x-auto">

<table class="w-full min-w-[700px] border-separate border-spacing-y-3">

<thead>

<tr class="text-left text-purple-200">

<th>분야</th>
<th>점수</th>
<th>위험도</th>
<th>상태</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<div class="mt-20">

<h3 class="text-4xl font-black mb-8">
맞춤 피드백
</h3>

<div
id="feedbackArea"
class="grid gap-6">
</div>

</div>

</div>

</section>

<script>

const sections = [

{
title:'턱관절 상태',
key:'jaw',
max:9,

feedback:[
'턱관절 상태가 안정적입니다.',
'턱 주변 긴장 습관이 일부 나타날 수 있습니다.',
'턱관절 부담 위험이 높은 상태입니다.'
],

questions:[

[
'턱 주변에 뻐근함이 있나요?',
['전혀 없음',0],
['가끔 있음',1],
['자주 있음',2],
['거의 항상',3]
],

[
'입을 벌릴 때 소리가 나나요?',
['없음',0],
['가끔 남',1],
['자주 남',2],
['항상 남',3]
],

[
'이를 악무는 습관이 있나요?',
['전혀 없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
]

]
},

{
title:'거북목 · 상체 자세',
key:'neck',
max:12,

feedback:[
'비교적 바른 자세를 유지하고 있습니다.',
'거북목 초기 위험이 증가하고 있습니다.',
'거북목 자세 위험이 높은 상태입니다.'
],

questions:[

[
'고개를 앞으로 숙이나요?',
['거의 숙이지 않음',0],
['약간 숙임',1],
['많이 숙임',2],
['매우 많이 숙임',3]
],

[
'어깨가 앞으로 말리나요?',
['없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
],

[
'목·어깨 피로가 있나요?',
['거의 없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
],

[
'장시간 같은 자세를 유지하나요?',
['거의 없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
]

]
},

{
title:'근골격계 통증',
key:'pain',
max:9,

feedback:[
'통증이 거의 없는 상태입니다.',
'근육 긴장이 일부 나타날 수 있습니다.',
'근골격계 부담이 누적된 상태입니다.'
],

questions:[

[
'목 통증 빈도는?',
['없음',0],
['가끔',1],
['자주',2],
['거의 항상',3]
],

[
'어깨·등 통증 빈도는?',
['없음',0],
['가끔',1],
['자주',2],
['거의 항상',3]
],

[
'사용 후 통증이 심해지나요?',
['전혀 아니다',0],
['아니다',1],
['그렇다',2],
['매우 그렇다',3]
]

]
},

{
title:'손목 · 건초염',
key:'wrist',
max:6,

feedback:[
'손목 상태가 안정적입니다.',
'반복 사용 피로가 나타날 수 있습니다.',
'손목 부담 위험이 높은 상태입니다.'
],

questions:[

[
'손목 통증이 있나요?',
['없음',0],
['가끔',1],
['자주',2],
['거의 항상',3]
],

[
'엄지를 많이 사용하나요?',
['거의 아니다',0],
['가끔',1],
['자주',2],
['항상',3]
]

]
}

];

let current = 0;
const answers = {};

function startTest(){

document.getElementById('hero')
.style.display='none';

document.getElementById('testSection')
.classList.remove('hidden');

renderSection();

}

function renderSection(){

const section = sections[current];
const box = document.getElementById('questionBox');

let html = `

<div class="card rounded-[40px] p-10 fade">

<div class="flex justify-between items-center mb-10">

<div>

<h2 class="text-5xl font-black mb-3">
${section.title}
</h2>

<p class="text-gray-400">
${current+1} / ${sections.length}
</p>

</div>

<div class="text-purple-300 font-bold">
최대 ${section.max}점
</div>

</div>

`;

section.questions.forEach((q,index)=>{

html += `

<div class="mb-10">

<h3 class="text-2xl font-bold mb-5">
${index+1}. ${q[0]}
</h3>

<div class="grid md:grid-cols-2 gap-4">

`;

for(let i=1;i<q.length;i++){

html += `

<button
onclick="selectAnswer(${current},${index},${q[i][1]},this)"
class="option card rounded-2xl p-5 text-left">

${q[i][0]}

</button>

`;

}

html += `</div></div>`;

});

html += `

<div class="flex justify-between mt-14">

<button
onclick="prevSection()"
class="card px-8 py-4 rounded-2xl ${current===0 ? 'opacity-30 pointer-events-none':''}">

이전

</button>

<button
onclick="nextSection()"
class="bg-gradient-to-r from-purple-400 to-pink-300 text-black font-black px-8 py-4 rounded-2xl">

${current===sections.length-1 ? '결과 보기':'다음'}

</button>

</div>

</div>

`;

box.innerHTML = html;

}

function selectAnswer(sectionIndex,questionIndex,score,element){

answers[`${sectionIndex}-${questionIndex}`] = score;

const parent = element.parentElement;

parent.querySelectorAll('.option').forEach(btn=>{
btn.classList.remove('active');
});

element.classList.add('active');

}

function nextSection(){

const totalQuestions =
sections[current].questions.length;

let answered = 0;

for(let i=0;i<totalQuestions;i++){

if(
answers[`${current}-${i}`]
!== undefined
){
answered++;
}

}

if(answered !== totalQuestions){

alert('모든 질문에 답해주세요.');
return;

}

if(current < sections.length-1){

current++;
renderSection();

}else{

showResults();

}

}

function prevSection(){

if(current > 0){

current--;
renderSection();

}

}

function showResults(){

document.getElementById('testSection')
.classList.add('hidden');

document.getElementById('resultSection')
.classList.remove('hidden');

let total = 0;
const scores = {};

sections.forEach((section,sIndex)=>{

let score = 0;

section.questions.forEach((q,qIndex)=>{

score +=
answers[`${sIndex}-${qIndex}`] || 0;

});

scores[section.key] = score;
total += score;

});

document.getElementById('totalScore')
.innerText = `${total}점`;

const risk =
document.getElementById('riskLevel');

const text =
document.getElementById('riskText');

if(total <= 10){

risk.innerText = '낮음';
text.innerText =
'현재 건강 상태는 비교적 안정적인 상태입니다.';

}
else if(total <= 20){

risk.innerText = '보통';
text.innerText =
'생활습관 및 자세 교정이 필요한 상태입니다.';

}
else if(total <= 30){

risk.innerText = '높음';
text.innerText =
'근골격계 부담이 증가하고 있는 상태입니다.';

}
else{

risk.innerText = '매우 높음';
text.innerText =
'지속적인 자세 관리와 생활습관 개선이 필요한 상태입니다.';

}

renderGraphs(scores);
renderFeedback(scores);

}

function renderGraphs(scores){

const area =
document.getElementById('graphArea');

const table =
document.getElementById('tableBody');

area.innerHTML='';
table.innerHTML='';

sections.forEach(section=>{

const score =
scores[section.key];

const percent =
(score / section.max) * 100;

let risk='낮음';
let state='안정적';

if(percent >= 70){

risk='높음';
state='관리 필요';

}
else if(percent >= 40){

risk='보통';
state='주의 필요';

}

area.innerHTML += `

<div class="card rounded-[36px] p-8">

<div class="flex justify-between mb-6">

<div>

<h3 class="text-3xl font-black mb-2">
${section.title}
</h3>

<p class="text-gray-400">
건강 상태 분석
</p>

</div>

<div class="text-right">

<div class="text-5xl font-black">
${score}
</div>

<div class="text-gray-400">
/ ${section.max}
</div>

</div>

</div>

<div class="w-full h-5 bg-black/30 rounded-full overflow-hidden mb-5">

<div
class="bar"
style="width:${percent}%">
</div>

</div>

<div class="flex justify-between text-sm">

<span>${risk}</span>
<span>${Math.round(percent)}%</span>

</div>

</div>

`;

table.innerHTML += `

<tr class="bg-white/5">

<td class="py-5 px-4 rounded-l-2xl">
${section.title}
</td>

<td class="py-5 px-4">
${score} / ${section.max}
</td>

<td class="py-5 px-4">
${risk}
</td>

<td class="py-5 px-4 rounded-r-2xl">
${state}
</td>

</tr>

`;

});

}

function renderFeedback(scores){

const area =
document.getElementById('feedbackArea');

area.innerHTML='';

sections.forEach(section=>{

const score =
scores[section.key];

let text='';

if(score <= section.max * 0.3){

text = section.feedback[0];

}
else if(score <= section.max * 0.6){

text = section.feedback[1];

}
else{

text = section.feedback[2];

}

area.innerHTML += `

<div class="card rounded-[32px] p-8">

<h3 class="text-3xl font-black mb-5">
${section.title}
</h3>

<p class="text-gray-300 leading-relaxed text-lg">
${text}
</p>

</div>

`;

});

}

</script>

</body>
</html>
