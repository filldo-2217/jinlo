<!-- ========================= 이대훈짱 ^__^================================ -->
<!-- index.html -->

<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthMind</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
margin:0;
font-family:Pretendard,sans-serif;
background:#07030f;
color:white;
overflow-x:hidden;
}

.bg1{
position:fixed;
top:-200px;
left:-100px;
width:500px;
height:500px;
background:#7c3aed33;
filter:blur(140px);
border-radius:999px;
z-index:-1;
}

.bg2{
position:fixed;
bottom:-200px;
right:-100px;
width:500px;
height:500px;
background:#ec489933;
filter:blur(140px);
border-radius:999px;
z-index:-1;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(24px);
}

.option{
transition:.3s;
}

.option:hover{
border-color:#c084fc;
background:rgba(255,255,255,0.08);
}

.option.active{
border-color:#c084fc;
background:
linear-gradient(
to right,
rgba(192,132,252,.28),
rgba(236,72,153,.2)
);
}

.fade{
animation:fade .4s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.icon-badge{
width:68px;
height:68px;
border-radius:24px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
rgba(139,92,246,.28),
rgba(236,72,153,.16)
);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 40px rgba(139,92,246,.18);

backdrop-filter:blur(20px);
}

.icon-badge svg{
width:32px;
height:32px;
stroke:#f3e8ff;
stroke-width:1.8;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
}

.progress-wrap{
height:12px;
background:rgba(255,255,255,.06);
border-radius:999px;
overflow:hidden;
}

.progress-real{
height:100%;
border-radius:999px;

background:
linear-gradient(
90deg,
#8b5cf6,
#ec4899
);
}

.analysis-risk{
padding:8px 14px;
border-radius:999px;
font-size:14px;
font-weight:700;
display:inline-flex;
align-items:center;
}

.risk-low{
background:rgba(34,197,94,.15);
color:#86efac;
}

.risk-mid{
background:rgba(250,204,21,.12);
color:#fde68a;
}

.risk-high{
background:rgba(239,68,68,.12);
color:#fca5a5;
}

.section-card{
background:
linear-gradient(
180deg,
rgba(255,255,255,.05),
rgba(255,255,255,.03)
);

border:1px solid rgba(255,255,255,.06);
backdrop-filter:blur(20px);
}

</style>

</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<!-- HERO -->

<section
id="hero"
class="min-h-screen flex items-center">

<div class="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-20 items-center">

<div>

<div class="inline-block px-5 py-3 rounded-full border border-purple-400/20 bg-purple-500/10 text-purple-200 mb-8">
조원: 임지훈, 정유민, 이승우, 신지수
</div>

<h1 class="text-7xl font-black leading-tight mb-8">

스마트폰 사용으로 인한

<span class="block bg-gradient-to-r from-purple-300 to-white bg-clip-text text-transparent">
건강 상태 분석
</span>

</h1>

<p class="text-gray-300 text-xl leading-relaxed mb-10">

턱관절, 목 통증,
근골격계 부담 등을 분석하여
현재 건강 상태를 확인할 수 있습니다.

</p>

<button
onclick="startTest()"
class="bg-gradient-to-r from-purple-400 to-pink-300 text-black font-black px-10 py-5 rounded-2xl hover:scale-105 transition-all duration-300">

건강 상태 검사하기

</button>

</div>

<!-- 오른쪽 -->

<div class="relative flex items-center justify-center">

<div class="absolute w-[420px] h-[420px] bg-purple-500/20 blur-3xl rounded-full"></div>

<div class="card rounded-[42px] p-8 w-full max-w-2xl relative overflow-hidden">

<div class="flex items-center justify-between mb-8">

<div>
<p class="text-purple-200 text-sm mb-2 tracking-[0.25em]">
자세 분석 해보자!~!
</p>

<h3 class="text-4xl font-black leading-tight">
스마트 자세 분석 검사
</h3>
</div>

<div class="w-16 h-16 rounded-3xl bg-gradient-to-br from-purple-400 to-pink-300 flex items-center justify-center shadow-2xl shadow-purple-500/30">

<svg width="30" height="30" viewBox="0 0 24 24" stroke="black" fill="none" stroke-width="1.8">

<path d="M9 5C9 3.5 10.5 2 12 2C13.5 2 15 3.5 15 5V9C15 11 13.5 13 12 13C10.5 13 9 11 9 9V5Z"/>

<path d="M7 22C7 18.5 9 16 12 16C15 16 17 18.5 17 22"/>

</svg>

</div>

</div>

<div class="grid gap-5">

<div class="rounded-3xl border border-white/10 bg-white/5 p-6 flex items-center justify-between">

<div>

<p class="text-gray-400 text-sm mb-2">
목 · 어깨 정렬 상태
</p>

<h4 class="text-2xl font-black">
자세 부담 분석
</h4>

</div>

<div class="w-14 h-14 rounded-2xl bg-purple-500/15 flex items-center justify-center">

<svg width="28" height="28" viewBox="0 0 24 24" stroke="#d8b4fe" fill="none" stroke-width="1.8">

<path d="M12 3V10"/>
<path d="M12 10C12 14 15 17 19 17"/>
<path d="M12 10C12 14 9 17 5 18"/>

</svg>

</div>

</div>

<div class="rounded-3xl border border-white/10 bg-white/5 p-6 flex items-center justify-between">

<div>

<p class="text-gray-400 text-sm mb-2">
턱관절 · 근육 긴장
</p>

<h4 class="text-2xl font-black">
턱 사용 패턴 분석
</h4>

</div>

<div class="w-14 h-14 rounded-2xl bg-pink-500/15 flex items-center justify-center">

<svg width="28" height="28" viewBox="0 0 24 24" stroke="#f9a8d4" fill="none" stroke-width="1.8">

<path d="M8 10C8 6 10 4 12 4C14 4 16 6 16 10"/>
<path d="M8 10V13C8 16 10 20 12 20C14 20 16 16 16 13V10"/>

</svg>

</div>

</div>

<div class="rounded-3xl border border-white/10 bg-white/5 p-6 flex items-center justify-between">

<div>

<p class="text-gray-400 text-sm mb-2">
잘못된 자세
</p>

<h4 class="text-2xl font-black">
근골격계 부담 분석
</h4>

</div>

<div class="w-14 h-14 rounded-2xl bg-violet-500/15 flex items-center justify-center">

<svg width="28" height="28" viewBox="0 0 24 24" stroke="#c4b5fd" fill="none" stroke-width="1.8">

<path d="M8 7V17"/>
<path d="M12 5V19"/>
<path d="M16 8V16"/>
<path d="M6 19H18"/>

</svg>

</div>

</div>

</div>

</div>

</div>

</div>

</section>

<!-- TEST -->

<section
id="testSection"
class="hidden max-w-5xl mx-auto px-6 py-24">

<div id="questionBox"></div>

</section>

<!-- RESULT -->

<section
id="resultSection"
class="hidden max-w-6xl mx-auto px-6 pb-32">

<div class="card rounded-[40px] p-10 fade">

<div class="text-center mb-16">

<h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-purple-300 to-white bg-clip-text text-transparent">
건강 분석 결과
</h2>

<div
id="totalScore"
class="text-7xl font-black mb-5">
</div>

<div
id="riskLevel"
class="text-3xl font-bold mb-6">
</div>

<p
id="riskText"
class="text-gray-300 text-lg leading-relaxed max-w-3xl mx-auto">
</p>

</div>

<div
id="graphArea"
class="space-y-8">
</div>

<div class="mt-20">

<h3 class="text-4xl font-black mb-8">
상세 건강 분석
</h3>

<div class="grid lg:grid-cols-3 gap-6" id="tableBody"></div>

</div>

<div class="mt-20">

<h3 class="text-4xl font-black mb-8">
맞춤 피드백
</h3>

<div
id="feedbackArea"
class="grid gap-6">
</div>

</div>

</div>

</section>

<script>

const sections = [

{
title:'턱관절 상태',

icon:`
<div class="icon-badge">

<svg viewBox="0 0 24 24">

<path d="M8 10C8 6 10 4 12 4C14 4 16 6 16 10"/>

<path d="M8 10V13C8 16 10 20 12 20C14 20 16 16 16 13V10"/>

<path d="M9 14H15"/>

</svg>

</div>
`,

key:'jaw',
max:9,

feedback:[
'턱관절과 주변 근육 상태가 안정적인 편입니다.',
'턱 주변 긴장 습관이 일부 나타날 수 있습니다.',
'턱관절 부담 가능성이 높은 상태입니다.'
],

questions:[

[
'턱 주변에 뻐근함이 있나요?',
['전혀 없음',0],
['가끔 있음',1],
['자주 있음',2],
['거의 항상',3]
],

[
'입을 벌릴 때 턱에서 소리가 나나요?',
['없음',0],
['가끔 남',1],
['자주 남',2],
['항상 남',3]
],

[
'이를 악무는 습관이 있나요?',
['전혀 없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
]

]
},

{
title:'거북목 · 상체 자세',

icon:`
<div class="icon-badge">

<svg viewBox="0 0 24 24">

<path d="M12 3V10"/>

<path d="M12 10C12 14 15 17 19 17"/>

<path d="M12 10C12 14 9 17 5 18"/>

<path d="M9 21H15"/>

</svg>

</div>
`,

key:'neck',
max:12,

feedback:[
'비교적 바른 자세를 유지하고 있습니다.',
'거북목 초기 위험이 증가하고 있습니다.',
'거북목 자세 위험이 높은 상태입니다.'
],

questions:[

[
'고개를 앞으로 숙이나요?',
['거의 숙이지 않음',0],
['약간 숙임',1],
['많이 숙임',2],
['매우 많이 숙임',3]
],

[
'어깨가 앞으로 말리나요?',
['없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
],

[
'목·어깨 피로가 있나요?',
['거의 없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
],

[
'장시간 같은 자세를 유지하나요?',
['거의 없음',0],
['가끔 있음',1],
['자주 있음',2],
['항상 있음',3]
]

]
},

{
title:'근골격계 통증',

icon:`
<div class="icon-badge">

<svg viewBox="0 0 24 24">

<path d="M12 4V20"/>

<path d="M8 8L12 4L16 8"/>

<path d="M8 16L12 20L16 16"/>

</svg>

</div>
`,

key:'pain',
max:9,

feedback:[
'통증이 거의 없는 안정적인 상태입니다.',
'근육 긴장이 일부 나타날 수 있습니다.',
'근골격계 부담이 누적된 상태입니다.'
],

questions:[

[
'목 통증 빈도는?',
['없음',0],
['가끔',1],
['자주',2],
['거의 항상',3]
],

[
'어깨·등 통증 빈도는?',
['없음',0],
['가끔',1],
['자주',2],
['거의 항상',3]
],

[
'스마트폰 사용 후 통증이 심해지나요?',
['전혀 아니다',0],
['아니다',1],
['그렇다',2],
['매우 그렇다',3]
]

]
}

];

let current = 0;
const answers = {};

function startTest(){

document.getElementById('hero').style.display='none';

document.getElementById('testSection')
.classList.remove('hidden');

renderSection();

}

function renderSection(){

const section = sections[current];
const box = document.getElementById('questionBox');

let html = `

<div class="card rounded-[40px] p-10 fade">

<div class="flex justify-between items-center mb-10">

<div>

<h2 class="text-5xl font-black mb-4 flex items-center gap-5">

${section.icon}

${section.title}

</h2>

<p class="text-gray-400">

${current+1} / ${sections.length}

</p>

</div>

<div class="text-purple-300 font-bold">
최대 ${section.max}점
</div>

</div>

`;

section.questions.forEach((q,index)=>{

html += `

<div class="mb-10">

<h3 class="text-2xl font-bold mb-5">
${index+1}. ${q[0]}
</h3>

<div class="grid md:grid-cols-2 gap-4">

`;

for(let i=1;i<q.length;i++){

html += `

<button
onclick="selectAnswer(${current},${index},${q[i][1]},this)"
class="option card rounded-2xl p-5 text-left">

${q[i][0]}

</button>

`;

}

html += `</div></div>`;

});

html += `

<div class="flex justify-between mt-14">

<button
onclick="prevSection()"
class="card px-8 py-4 rounded-2xl ${current===0 ? 'opacity-30 pointer-events-none':''}">

이전

</button>

<button
onclick="nextSection()"
class="bg-gradient-to-r from-purple-400 to-pink-300 text-black font-black px-8 py-4 rounded-2xl">

${current===sections.length-1 ? '결과 보기':'다음'}

</button>

</div>

</div>

`;

box.innerHTML = html;

}

function selectAnswer(sectionIndex,questionIndex,score,element){

answers[`${sectionIndex}-${questionIndex}`] = score;

const parent = element.parentElement;

parent.querySelectorAll('.option').forEach(btn=>{
btn.classList.remove('active');
});

element.classList.add('active');

}

function nextSection(){

const totalQuestions =
sections[current].questions.length;

let answered = 0;

for(let i=0;i<totalQuestions;i++){

if(
answers[`${current}-${i}`]
!== undefined
){
answered++;
}

}

if(answered !== totalQuestions){

alert('모든 질문에 답해주세요.');
return;

}

if(current < sections.length-1){

current++;
renderSection();

}else{

showResults();

}

}

function prevSection(){

if(current > 0){

current--;
renderSection();

}

}

function showResults(){

document.getElementById('testSection')
.classList.add('hidden');

document.getElementById('resultSection')
.classList.remove('hidden');

let total = 0;
const scores = {};

sections.forEach((section,sIndex)=>{

let score = 0;

section.questions.forEach((q,qIndex)=>{

score +=
answers[`${sIndex}-${qIndex}`] || 0;

});

scores[section.key] = score;
total += score;

});

document.getElementById('totalScore')
.innerText = `${total}점`;

const risk =
document.getElementById('riskLevel');

const text =
document.getElementById('riskText');

if(total <= 10){

risk.innerText = '낮음';
text.innerText =
'현재 건강 상태는 비교적 안정적인 상태입니다.';

}
else if(total <= 20){

risk.innerText = '보통';
text.innerText =
'생활습관 및 자세 교정이 필요한 상태입니다.';

}
else{

risk.innerText = '높음';
text.innerText =
'근골격계 부담이 증가하고 있는 상태입니다.';

}

renderGraphs(scores);
renderFeedback(scores);

}

function renderGraphs(scores){

const area =
document.getElementById('graphArea');

const table =
document.getElementById('tableBody');

area.innerHTML='';
table.innerHTML='';

sections.forEach(section=>{

const score =
scores[section.key];

const percent =
(score / section.max) * 100;

let risk='낮음';
let riskClass='risk-low';
let state='안정적';

if(percent >= 70){

risk='높음';
riskClass='risk-high';
state='관리 필요';

}
else if(percent >= 40){

risk='보통';
riskClass='risk-mid';
state='주의 필요';

}

area.innerHTML += `

<div class="section-card rounded-[34px] p-8">

<div class="flex items-center justify-between mb-7">

<div class="flex items-center gap-5">

${section.icon}

<div>

<h3 class="text-3xl font-black mb-2">
${section.title}
</h3>

<p class="text-gray-400">
분야별 건강 분석 데이터
</p>

</div>

</div>

<div class="text-right">

<div class="text-5xl font-black">
${score}
</div>

<div class="text-gray-400">
/ ${section.max}
</div>

</div>

</div>

<div class="progress-wrap mb-5">

<div
class="progress-real"
style="width:${percent}%">
</div>

</div>

<div class="flex justify-between items-center">

<div class="analysis-risk ${riskClass}">
${risk}
</div>

<div class="text-gray-400">
${Math.round(percent)}%
</div>

</div>

</div>

`;

table.innerHTML += `

<div class="section-card rounded-[34px] p-7 hover:scale-[1.02] transition-all duration-300">

<div class="flex items-center justify-between mb-7">

<div class="flex items-center gap-4">

${section.icon}

<div>

<h4 class="text-2xl font-black mb-1">
${section.title}
</h4>

<p class="text-gray-400 text-sm">
분야별 건강 상태 분석
</p>

</div>

</div>

<div class="analysis-risk ${riskClass}">
${risk}
</div>

</div>

<div class="mb-6">

<div class="flex justify-between mb-3">

<div class="text-gray-300">
건강 점수
</div>

<div class="font-bold">
${score} / ${section.max}
</div>

</div>

<div class="progress-wrap">

<div
class="progress-real"
style="width:${percent}%">
</div>

</div>

</div>

<div class="rounded-2xl bg-white/5 border border-white/5 p-5">

<div class="text-sm text-gray-400 mb-2">
현재 상태
</div>

<div class="text-lg font-semibold">
${state}
</div>

</div>

</div>

`;

});

}

function renderFeedback(scores){

const area =
document.getElementById('feedbackArea');

area.innerHTML='';

sections.forEach(section=>{

const score =
scores[section.key];

let text='';

if(score <= section.max * 0.3){

text = section.feedback[0];

}
else if(score <= section.max * 0.6){

text = section.feedback[1];

}
else{

text = section.feedback[2];

}

area.innerHTML += `

<div class="section-card rounded-[32px] p-8">

<div class="flex items-center gap-5 mb-5">

${section.icon}

<h3 class="text-3xl font-black">
${section.title}
</h3>

</div>

<p class="text-gray-300 leading-relaxed text-lg">
${text}
</p>

</div>

`;

});

}

</script>

</body>
</html>
